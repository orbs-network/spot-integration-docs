name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "README.md"
      - "package.json"
      - "yarn.lock"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "vercel.json"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:
    inputs:
      partner:
        description: "Frontend partner to deploy"
        required: true
        type: choice
        default: default
        options:
          - default
          - katana

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-targets:
    name: Resolve frontend deploy targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        name: Build target matrix
        env:
          FRONTEND_PARTNER: ${{ github.event_name == 'workflow_dispatch' && inputs.partner || 'all' }}
        run: |
          set -euo pipefail
          default_target='{"partner":"default","name":"default","vercelProjectId":"prj_uMBZSztD2z9Oaoi0n4gMmznXj2cl"}'
          katana_target='{"partner":"katana","name":"VERCEL_PARTNER_KATANA","vercelProjectId":"prj_nzSej5ScRhLPS3qPACCAz4ntfYCD"}'

          case "$FRONTEND_PARTNER" in
            default)
              matrix="{\"target\":[$default_target]}"
              ;;
            katana)
              matrix="{\"target\":[$katana_target]}"
              ;;
            all)
              matrix="{\"target\":[$default_target,$katana_target]}"
              ;;
            *)
              echo "Unsupported frontend partner: $FRONTEND_PARTNER" >&2
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy frontend (${{ matrix.target.partner }})
    needs: resolve-targets
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
    env:
      VERCEL_ORG_ID: team_t6YZC010wIUd8yFGN6mkglL9
      VERCEL_PROJECT_ID: ${{ matrix.target.vercelProjectId }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TARGET_NAME: ${{ matrix.target.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel configuration
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing Vercel token secret: VERCEL_TOKEN" >&2
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "Missing VERCEL_ORG_ID" >&2
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing VERCEL_PROJECT_ID" >&2
            exit 1
          fi

      - name: Prepare git metadata for Vercel
        env:
          SERVICE_NAME: Orbs Deploy Bot
          SERVICE_EMAIL: perps@orbs.com
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git checkout -B "$BRANCH_NAME" "${GITHUB_SHA}"

          original_subject="$(git log -1 --pretty=%s)"

          git config user.name "$SERVICE_NAME"
          git config user.email "$SERVICE_EMAIL"
          git commit --allow-empty -m "$original_subject" --no-verify

          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Author: $(git log -1 --pretty='%an <%ae>')"
          echo "Subject: $(git log -1 --pretty=%s)"

      - name: Build and deploy to Vercel
        run: |
          set -euo pipefail
          echo "Pulling Vercel production environment for $VERCEL_TARGET_NAME"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

          echo "Building Vercel output for $VERCEL_TARGET_NAME"
          vercel build --prod --token="$VERCEL_TOKEN"

          echo "Deploying prebuilt Vercel output for $VERCEL_TARGET_NAME"
          vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
